<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Integrasi Pabrik LKJ · JLP · Marketing · Ekspedisi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============== LOGIN ============== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand"><span class="dot"></span><span>APLIKASI</span></div>
      <div class="login-sub">Integrasi Pabrik LKJ, Pabrik JLP, Marketing &amp; Team Ekspedisi</div>
      <div id="login-error" class="login-error"></div>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input id="email" type="email" required autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input id="password" type="password" required autocomplete="current-password" minlength="6">
        </div>
        <button id="submit-btn" class="btn btn-primary" type="submit">Masuk</button>
      </form>
      <div class="login-toggle">
        <button id="mode-toggle" type="button">Belum punya akun? Daftar</button>
      </div>
    </div>
  </div>

  <!-- ============== APP SHELL ============== -->
  <div id="app-screen">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="dot"></span><span>APLIKASI</span></div>
      <span id="role-badge" class="role-badge"></span>
      <nav id="nav-menu" class="menu"></nav>
      <div class="sidebar-foot">
        <div id="who" class="who mono"></div>
        <button id="logout-btn" class="btn btn-danger">Keluar</button>
      </div>
    </aside>
    <main class="main">
      <div class="topline">
        <div class="topline-title">
          <span class="topline-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg></span>
          <h1 id="view-title"></h1>
        </div>
        <div class="topline-date">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="clock" class="clock mono"></span>
        </div>
      </div>
      <div id="view-body"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
